{% extends 'layout.html' %}
{% block content %}
    <div class="container mt-3">
        <div class="row">
            <div class="col">
                <h1>Сайты</h1>
                <table class="table table-bordered table-hover mt-3" data-test="urls">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Имя</th>
                            <th>Последняя проверка</th>
                            <th>Код ответа</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for url in urls %}
                        <tr>
                            <td>{{ url.id }}</td>
                            <td><a href="{{ url_for('show_url', id=url.id) }}">{{ url.name }}</a></td>
                            <td>
                                {% if url.last_check %}
                                    {{ url.last_check.strftime('%Y-%m-%d') }}
                                {% else %}
                                    -
                                {% endif %}
                            </td>
                            <td>{{ url.status_code or '' }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
{% endblock %}
