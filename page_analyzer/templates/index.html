{% extends 'layout.html' %}
{% block content %}
    {% if messages %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}" role="alert">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}
    <div class="container mt-3">
        <div class="row justify-content-center">
            <div class="col-8">
                <div class="card shadow">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-12">
                            <h1>Анализатор страниц</h1>
                            <h5>Бесплатно проверяйте сайты на SEO-пригодность</h5>
                            </div>
                        </div>
                        <form action="{{ url_for('add_url') }}" method="post">
                            <div class="row mt-3 g-2 align-items-end">
                                <div class="col-8">
                                    <label class="visually-hidden" for="url">Введите URL</label>
                                    <input class="form-control" id="url" name="url" placeholder="https://www.example.com">
                                </div>
                                <div class="col-4">
                                    <button type="submit" class="btn btn-primary w-100">Проверить</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
